name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install bounded binary dependencies
        run: "python -m pip install --only-binary=:all: -r requirements.txt"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q image_downloader.py tests
      - name: Test
        run: python -m unittest discover -s tests -v

  browser-dependency:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install optional browser dependency set
        run: "python -m pip install --only-binary=:all: -r requirements-browser.txt"
      - name: Verify optional dependency consistency
        run: python -m pip check
      - name: Validate Playwright import without downloading browsers
        run: python -c "from playwright.sync_api import sync_playwright; assert sync_playwright"

