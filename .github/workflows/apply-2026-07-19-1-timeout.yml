name: Apply reviewed 2026.07.19.1 timeout release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-2026-07-19-1-timeout.yml
      - .github/scripts/apply_2026_07_19_1_timeout.py

permissions:
  contents: write

concurrency:
  group: apply-image-downloader-2026-07-19-1-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.repository == 'Jnapier2/image-downloader'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply reviewed patch and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/apply_2026_07_19_1_timeout.py
          python -m compileall -q image_downloader.py tests
          python -m unittest discover -s tests -v
          python -c "import image_downloader as app; c=app.default_config(); assert app.APP_VERSION=='2026.07.19.1'; assert c['request_wall_clock_timeout_seconds']==5; assert c['page_wall_clock_timeout_seconds']==60; assert c['hide_downloaded_media'] is False; print('Image Downloader 2026.07.19.1 timeout contract: PASS')"

      - name: Remove one-use scaffolding and commit exact result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath .github/workflows/apply-2026-07-19-1-timeout.yml -Force
          Remove-Item -LiteralPath .github/scripts/apply_2026_07_19_1_timeout.py -Force
          if (Test-Path -LiteralPath .github/scripts) {
            $remaining = @(Get-ChildItem -LiteralPath .github/scripts -Force)
            if ($remaining.Count -eq 0) { Remove-Item -LiteralPath .github/scripts -Force }
          }
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release Image Downloader 2026.07.19.1 timeout budget' -m 'Merge the verified five-second per-image network deadline into the stronger public-security source while preserving visible output, private-address controls, validation, duplicate detection, adaptive reconnect behavior, and report-only exports.' -m 'Copyright © 2026 Gateway Information Group LLC. All rights reserved.'
          git push origin HEAD:main

