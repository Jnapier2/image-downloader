name: One-use Image Downloader gate-order repair

on:
  push:
    branches:
      - agent/image-downloader-gate-order-repair-20260815
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-downloader-gate-order-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Patch gate ordering and regenerate release identity
        shell: powershell
        run: python .github/one_use_repair_image_downloader.py

      - name: Install bounded dependencies
        shell: powershell
        run: python -m pip install --only-binary=:all: -r requirements.txt

      - name: Verify dependency consistency
        shell: powershell
        run: python -m pip check

      - name: Compile and test exact repaired tree
        shell: powershell
        run: |
          python -m compileall -q image_downloader.py tests
          python -m unittest discover -s tests -v
          python image_downloader.py --verify-release

      - name: Commit repaired source and remove finalizer
        shell: powershell
        run: |
          Remove-Item -LiteralPath ".github/workflows/one-use-gate-order-repair.yml" -Force
          Remove-Item -LiteralPath ".github/one_use_repair_image_downloader.py" -Force
          git config user.name "Jerry R. Napier"
          git config user.email "41520658+Jnapier2@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Image Downloader integrity-gate ordering"
          git push origin "HEAD:${{ github.ref_name }}"
